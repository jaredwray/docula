name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: "1.15.0"
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        registry-url: "https://registry.npmjs.org"
        package-manager-cache: false

    - name: Enable Corepack
      run: corepack enable

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Testing
      run: pnpm test:ci

    - name: Pack
      run: |
        mkdir -p packed
        pnpm pack --pack-destination packed
        ls -la packed

    - name: Ensure npm CLI for staged publishing
      # zizmor: ignore[adhoc-packages] pin npm 11.19.0 so `npm stage publish` is available
      run: npm install --global npm@11.19.0

    - name: Stage publish
      run: npm stage publish packed/*.tgz --access public --provenance
