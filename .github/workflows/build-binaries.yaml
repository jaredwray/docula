name: build-binaries

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build-binary:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: docula
            asset: docula-linux-x64
          - os: macos-latest
            binary: docula
            asset: docula-macos-arm64
          - os: windows-latest
            binary: docula.exe
            asset: docula-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build Binary
        run: pnpm build:binary

      - name: Smoke Test Binary
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          ./dist/${BINARY_NAME} version
          ./dist/${BINARY_NAME} build -s ./test/fixtures/single-page-site -o ./smoke-dist
          test -f ./smoke-dist/index.html

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

      - name: Upload to Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          BINARY_NAME: ${{ matrix.binary }}
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          cp "dist/${BINARY_NAME}" "dist/${ASSET_NAME}"
          gh release upload "${TAG_NAME}" "dist/${ASSET_NAME}" --clobber
